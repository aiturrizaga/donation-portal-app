<div class="flex justify-between gap-2" role="group" aria-label="Código de verificación">
  @for (i of cells(); track i) {
    <input
      #cell
      type="text"
      inputmode="numeric"
      [attr.autocomplete]="i === 0 ? 'one-time-code' : 'off'"
      [attr.aria-label]="'Dígito ' + (i + 1)"
      [value]="digits()[i].trim()"
      [disabled]="disabled()"
      (input)="onInput(i, $event)"
      (paste)="onPaste(i, $event)"
      (keydown)="onKeydown(i, $event)"
      (focus)="$any($event.target).select()"
      class="w-11 h-12 rounded-lg border text-center text-lg font-semibold text-gray-900 focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-100 disabled:bg-gray-50 disabled:text-gray-400"
      [class.border-gray-200]="!invalid()"
      [class.border-red-300]="invalid()"
    />
  }
</div>
