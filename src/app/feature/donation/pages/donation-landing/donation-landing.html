<div
  class="min-h-screen flex flex-col transition-all duration-500"
  [style]="backgroundStyle()"
>

  <!-- Header -->
  @if (store.page()) {
    <app-portal-header
      [organizationName]="orgName()"
      [logoUrl]="logoUrl()"
    />
  } @else {
    <div class="h-14"></div>
  }

  <!-- Main -->
  <div
    class="flex-1 flex flex-col lg:flex-row items-center justify-center gap-8 px-6 py-8 lg:px-16 relative"
  >

    <!-- Hero desktop -->
    <div class="hidden lg:flex flex-col gap-5 flex-1 max-w-md relative z-10">
      @if (heroHeading(); as heading) {
        <h1 class="text-4xl font-bold text-white leading-tight break-words [&_p]:m-0" [innerHTML]="heading"></h1>
      }
      @if (welcomeText(); as text) {
        <!-- El contenido enriquecido ya trae sus propios <p> — un <p> wrapper
             no puede contener un <p> anidado válidamente: el navegador cierra
             el wrapper apenas ve el <p> interno, y ese contenido escapa de la
             clase (queda con el color de texto por defecto del navegador,
             negro, en vez de heredar text-gray-300). Un <div> sí puede
             contener bloques anidados sin ese problema. -->
        <div class="text-gray-300 text-base leading-relaxed break-words [&_p]:m-0" [innerHTML]="text"></div>
      }
    </div>

    <!-- Hero mobile -->
    @if (heroHeading(); as heading) {
      <div class="lg:hidden text-center w-full relative z-10">
        <h1 class="text-2xl font-bold text-white leading-tight break-words" [innerHTML]="heading"></h1>
      </div>
    }

    <!-- Donation form -->
    @if (store.page()) {
      <div class="relative z-10">
        <app-donation-form/>
      </div>
    }

  </div>

  <!-- Footer -->
  @if (store.page()) {
    <app-portal-footer
      [organizationName]="orgName()"
      [organizationRuc]="store.page()!.organizationRuc"
      organizationAddress="Av. José Pardo 231, Of. 801, Miraflores - Lima"
      organizationEmail="donaciones@adeu.org.pe"
      organizationPhone="01 401-7529"
      [primaryColor]="primaryColor()"
      [legalPages]="legalPages()"
    />
  }

</div>
