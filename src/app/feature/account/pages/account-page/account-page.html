<div
  class="min-h-screen flex flex-col"
  style="
    background: linear-gradient(
      135deg,
      #0f1923 0%,
      #1a2a3a 50%,
      color-mix(in oklab, var(--brand) 22%, #0b0f14) 100%
    );
  "
>
  <app-portal-header [organizationName]="headerTitle()" [logoUrl]="logoUrl()" action="donate" />

  <div
    class="flex-1 flex flex-col lg:flex-row items-center justify-center gap-8 px-4 sm:px-6 py-8 lg:px-16"
    [class.lg:items-start]="account()"
  >
    @if (!account()) {
      <!-- Hero (solo en login) -->
      <div class="hidden lg:flex flex-col gap-5 flex-1 max-w-md">
        <span class="block w-12 h-1 rounded-full bg-brand-500"></span>
        <h1 class="text-4xl font-bold text-white leading-tight">
          Tus donaciones, en un solo lugar
        </h1>
        <p class="text-gray-300 text-base leading-relaxed">
          Consulta el historial de tus aportes, tus donaciones recurrentes y descarga tus
          certificados cuando los necesites.
        </p>
      </div>
    }

    <div
      class="bg-white rounded-2xl shadow-2xl w-full flex flex-col overflow-hidden"
      [class.max-w-sm]="!account()"
      [class.max-w-2xl]="account()"
    >
      @if (restoring()) {
        <div class="flex justify-center py-16"><app-spinner /></div>
      } @else if (account(); as current) {
        <app-account-dashboard
          [account]="current"
          [hostOrganizationName]="orgName()"
          (accountChange)="account.set($event)"
          (logout)="onLogout()"
        />
      } @else {
        <app-account-login [initialEmail]="email" (loggedIn)="onLoggedIn($event)" />
      }
    </div>
  </div>

  @if (hostPage(); as page) {
    <app-portal-footer
      [organizationName]="page.organizationName"
      [organizationRuc]="page.organizationRuc"
      [organizationAddress]="page.organizationAddress ?? ''"
      [organizationEmail]="page.organizationEmail ?? ''"
      [organizationPhone]="page.organizationPhone ?? ''"
      [legalPages]="legalPages()"
    />
  }
</div>
